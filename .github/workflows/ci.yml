name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Quality gate — runs on every push and on PRs targeting main.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run type-check
      # `rotation-composition.browser.test.ts` skips itself when Chromium is
      # absent, so without this install its assertions silently never run here —
      # and it is the only check that can catch a transposed `matrix3d` reading,
      # because it asks the browser's own transform parser rather than
      # hand-written helpers that share the implementation's convention.
      - name: Install Chromium for browser-backed tests
        run: npx playwright install --with-deps chromium
      - name: Unit tests with coverage gate
        run: npm run test:coverage
      - name: Build
        run: npm run build
